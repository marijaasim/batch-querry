<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarry Management — Invoices</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #ffffff;
        }

        .navbar {
            background: #16213e;
            border-bottom: 2px solid #e94560;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-left { display: flex; align-items: center; gap: 16px; }

        .navbar h1 {
            color: #e94560;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #a0a0b0;
            color: #a0a0b0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-back:hover { border-color: #ffffff; color: #ffffff; }

        .main { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover { background: #c73652; }
        .btn-secondary { background: #0f3460; color: #a0a0b0; border: 1px solid #1a4a7a; }
        .btn-secondary:hover { border-color: #e94560; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-danger { background: transparent; border: 1px solid #e94560; color: #e94560; }
        .btn-danger:hover { background: #e94560; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .filters-panel {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .filters-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
            margin-bottom: 16px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .filter-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0a0b0;
            margin-bottom: 6px;
        }

        .filter-group input {
            width: 100%;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .filter-group input:focus { border-color: #e94560; }

        .table-container {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        thead { background: #0f3460; }

        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid #0f3460;
            color: #e0e0e0;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td { background: rgba(233, 69, 96, 0.05); }

        tr.selected td { background: rgba(233, 69, 96, 0.1); border-left: 3px solid #e94560; }

        .amount { color: #27ae60; font-weight: 600; }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: #a0a0b0;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #e94560;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: #a0a0b0;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }

        .btn-close:hover { color: #ffffff; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }

        .form-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0a0b0;
            margin-bottom: 6px;
        }

        .form-group select,
        .form-group input {
            padding: 10px 14px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-group select:focus,
        .form-group input:focus { border-color: #e94560; }

        .form-group select option { background: #16213e; }

        .items-section { margin-bottom: 24px; }

        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .items-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
        }

        .items-table-wrap {
            background: #0f3460;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .items-table { width: 100%; border-collapse: collapse; }

        .items-table th {
            padding: 10px 12px;
            font-size: 11px;
            text-transform: uppercase;
            color: #a0a0b0;
            background: #0a2a50;
        }

        .items-table td {
            padding: 10px 12px;
            font-size: 13px;
            border-bottom: 1px solid #1a4a7a;
        }

        .items-table tr:last-child td { border-bottom: none; }

        .add-item-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .total-bar {
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .total-label { color: #a0a0b0; font-size: 14px; }
        .total-value { color: #27ae60; font-size: 20px; font-weight: 700; }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-left">
        <a href="/index.html" class="btn-back">← Back</a>
        <h1>Quarry Management</h1>
    </div>
</nav>

<div class="main">
    <div class="top-bar">
        <div class="page-title">Invoices</div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ New Invoice</button>
    </div>

    <!-- FILTERS -->
    <div class="filters-panel">
        <div class="filters-title">🔍 Search & Filter</div>
        <div class="filters-grid">
            <div class="filter-group">
                <label>User Name</label>
                <input type="text" id="filterUser" placeholder="Search by user..." oninput="applyFilters()" />
            </div>
            <div class="filter-group">
                <label>Buyer Name</label>
                <input type="text" id="filterBuyer" placeholder="Search by buyer..." oninput="applyFilters()" />
            </div>
            <div class="filter-group">
                <label>Date From</label>
                <input type="date" id="filterDateFrom" oninput="applyFilters()" />
            </div>
            <div class="filter-group">
                <label>Date To</label>
                <input type="date" id="filterDateTo" oninput="applyFilters()" />
            </div>
            <div class="filter-group">
                <label>Min Amount</label>
                <input type="number" id="filterMinAmount" placeholder="0" oninput="applyFilters()" />
            </div>
            <div class="filter-group">
                <label>Max Amount</label>
                <input type="number" id="filterMaxAmount" placeholder="999999" oninput="applyFilters()" />
            </div>
            <div class="filter-group">
                <button class="btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Buyer</th>
                <th>User</th>
                <th>Total Amount</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="invoicesTable">
            <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- CREATE / EDIT MODAL -->
<div class="modal-overlay" id="invoiceModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">New Invoice</div>
            <button class="btn-close" onclick="closeModal()">✕</button>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="invoiceDate" />
            </div>
            <div class="form-group">
                <label>Buyer</label>
                <select id="invoiceBuyer">
                    <option value="">Select buyer...</option>
                </select>
            </div>
            <div class="form-group">
                <label>User</label>
                <select id="invoiceUser">
                    <option value="">Select user...</option>
                </select>
            </div>
        </div>

        <!-- ITEMS -->
        <div class="items-section">
            <div class="items-header">
                <div class="items-title">Invoice Items</div>
            </div>

            <div class="items-table-wrap">
                <table class="items-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Block ID</th>
                        <th>Price</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="itemsTable">
                    <tr id="emptyItemsRow">
                        <td colspan="4" style="text-align:center; color:#a0a0b0; padding: 20px;">
                            No items added yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- BLOCKS TABLE -->
            <div class="items-section">
                <div class="items-title" style="margin-bottom: 12px;">Select a block to add</div>
                <div style="max-height: 200px; overflow-y: auto; border-radius: 8px; border: 1px solid #1a4a7a;">
                    <table class="items-table" id="blocksTable">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Dimensions (m)</th>
                            <th>Mass (t)</th>
                            <th>Class</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="blocksTableBody">
                        <tr><td colspan="7" style="text-align:center; color:#a0a0b0; padding:16px;">Loading blocks...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TOTAL -->
        <div class="total-bar">
            <div class="total-label">Total Amount</div>
            <div class="total-value" id="totalDisplay">0.00</div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveInvoice()">Save Invoice</button>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = '/login.html';

    let invoices = [];
    let buyers = [];
    let users = [];
    let blocks = [];
    let currentItems = [];
    let editingInvoiceId = null;
    let dataLoaded = false;

    async function init() {
        await loadInvoices();
        await loadBuyers();
    }

    async function loadInvoices() {
        const res = await fetch('/invoices');
        invoices = await res.json();
        renderTable(invoices);
    }

    async function loadBuyers() {
        const res = await fetch('/buyers');
        buyers = await res.json();
    }

    async function loadModalData() {
        if (dataLoaded) return;

        const resUsers = await fetch('/users');
        users = await resUsers.json();
        const selUser = document.getElementById('invoiceUser');
        selUser.innerHTML = '<option value="">Select user...</option>';
        users.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.name;
            selUser.appendChild(opt);
        });

        const selBuyer = document.getElementById('invoiceBuyer');
        selBuyer.innerHTML = '<option value="">Select buyer...</option>';
        buyers.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b.id;
            opt.textContent = b.name;
            selBuyer.appendChild(opt);
        });

        await loadBlocks();

        dataLoaded = true;
    }

    function renderTable(data) {
        const tbody = document.getElementById('invoicesTable');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No invoices found.</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(inv => `
            <tr>
                <td>#${inv.id}</td>
                <td>${inv.date ? inv.date.substring(0, 10) : '—'}</td>
                <td>${inv.buyerName || '—'}</td>
                <td>${inv.userName || '—'}</td>
                <td class="amount">€ ${inv.totalAmount.toFixed(2)}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="openEditModal(${inv.id})">Edit</button>
                </td>
            </tr>
        `).join('');
    }

    function getBuyerName(id) {
        const b = buyers.find(b => b.id == id);
        return b ? b.name : '—';
    }

    function getUserName(id) {
        const u = users.find(u => u.id == id);
        return u ? u.name : '—';
    }

    async function applyFilters() {
        const userName = document.getElementById('filterUser').value.trim();
        const buyerName = document.getElementById('filterBuyer').value.trim();
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        const minAmount = document.getElementById('filterMinAmount').value;
        const maxAmount = document.getElementById('filterMaxAmount').value;

        const params = new URLSearchParams();
        if (userName) params.append('userName', userName);
        if (buyerName) params.append('buyerName', buyerName);
        if (dateFrom) params.append('dateFrom', dateFrom);
        if (dateTo) params.append('dateTo', dateTo);
        if (minAmount) params.append('minAmount', minAmount);
        if (maxAmount) params.append('maxAmount', maxAmount);

        const hasFilters = [...params].length > 0;
        const url = hasFilters ? `/invoices/search?${params}` : '/invoices';

        const res = await fetch(url);
        const data = await res.json();
        renderTable(data);
    }

    function clearFilters() {
        document.getElementById('filterUser').value = '';
        document.getElementById('filterBuyer').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('filterMinAmount').value = '';
        document.getElementById('filterMaxAmount').value = '';
        renderTable(invoices);
    }

    async function openCreateModal() {
        await loadModalData();
        editingInvoiceId = null;
        currentItems = [];
        document.getElementById('modalTitle').textContent = 'New Invoice';
        document.getElementById('invoiceDate').value = '';
        document.getElementById('invoiceBuyer').value = '';
        document.getElementById('invoiceUser').value = '';
        renderItems();
        updateTotal();
        document.getElementById('invoiceModal').classList.add('active');
    }

    async function openEditModal(id) {
        await loadModalData();
        editingInvoiceId = id;
        document.getElementById('modalTitle').textContent = `Edit Invoice #${id}`;

        const res = await fetch(`/invoices/${id}`);
        const inv = await res.json();

        document.getElementById('invoiceDate').value = inv.date ? inv.date.substring(0, 10) : '';
        document.getElementById('invoiceBuyer').value = inv.buyerId;
        document.getElementById('invoiceUser').value = inv.userId;

        currentItems = inv.items ? inv.items.map(item => ({
            blockId: item.blockId,
            price: item.price
        })) : [];

        renderItems();
        updateTotal();
        document.getElementById('invoiceModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('invoiceModal').classList.remove('active');
    }

    const PRICES = {
        'A': { '1': 200, '2': 190, '3': 180 },
        'B': { '1': 160, '2': 150, '3': 140 },
        'C': { '1': 120, '2': 110, '3': 100 }
    };

    function calculatePrice(block) {
        const pricePerTon = PRICES[block.qualityClass]?.[block.category] ?? 100;
        return Math.round(pricePerTon * block.mass * 100) / 100;
    }

    async function loadBlocks() {
        const res = await fetch('/blocks');
        blocks = await res.json();
        renderBlocksTable();
    }

    function renderBlocksTable() {
        const tbody = document.getElementById('blocksTableBody');
        if (!blocks || blocks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#a0a0b0; padding:16px;">No blocks available.</td></tr>';
            return;
        }
        tbody.innerHTML = blocks.map(b => {
            const price = calculatePrice(b);
            return `
                <tr style="cursor:pointer;" onmouseover="this.style.background='rgba(233,69,96,0.08)'" onmouseout="this.style.background=''">
                    <td>#${b.id}</td>
                    <td>${b.length} × ${b.width} × ${b.height}</td>
                    <td>${(b.mass / 1000).toFixed(2)}</td>
                    <td>${b.qualityClass}</td>
                    <td>${b.category}</td>
                    <td class="amount">€ ${price.toFixed(2)}</td>
                    <td><button class="btn btn-success btn-sm" onclick="addItem(${b.id}, ${price})">+ Add</button></td>
                </tr>
            `;
        }).join('');
    }

    function addItem(blockId, price) {
        const alreadyAdded = currentItems.find(i => i.blockId === blockId);
        if (alreadyAdded) {
            alert('This block is already added to the invoice.');
            return;
        }
        currentItems.push({ blockId, price });
        renderItems();
        updateTotal();
    }

    function removeItem(index) {
        currentItems.splice(index, 1);
        renderItems();
        updateTotal();
    }

    function renderItems() {
        const tbody = document.getElementById('itemsTable');
        if (currentItems.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#a0a0b0;padding:20px;">No items added yet.</td></tr>`;
            return;
        }
        tbody.innerHTML = currentItems.map((item, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>Block #${item.blockId}</td>
                <td class="amount">€ ${item.price.toFixed(2)}</td>
                <td><button class="btn btn-danger btn-sm" onclick="removeItem(${i})">Remove</button></td>
            </tr>
        `).join('');
    }

    function updateTotal() {
        const total = currentItems.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('totalDisplay').textContent = `€ ${total.toFixed(2)}`;
    }

    async function saveInvoice() {
        const date = document.getElementById('invoiceDate').value;
        const buyerId = document.getElementById('invoiceBuyer').value;
        const userId = document.getElementById('invoiceUser').value;

        if (!date) { alert('Please select a date.'); return; }
        if (!buyerId) { alert('Please select a buyer.'); return; }
        if (!userId) { alert('Please select a user.'); return; }
        if (currentItems.length === 0) { alert('Please add at least one item.'); return; }

        const total = currentItems.reduce((sum, item) => sum + item.price, 0);
        const items = currentItems.map((item, i) => ({
            itemNo: i + 1,
            blockId: item.blockId,
            price: item.price
        }));

        try {
            if (editingInvoiceId) {
                await fetch(`/invoices/${editingInvoiceId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        invoice: {
                            id: editingInvoiceId,
                            date,
                            totalAmount: total,
                            userId: parseInt(userId),
                            buyerId: parseInt(buyerId)
                        },
                        items
                    })
                });
            } else {
                await fetch('/invoices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: null,
                        date,
                        totalAmount: total,
                        userId: parseInt(userId),
                        buyerId: parseInt(buyerId),
                        items
                    })
                });
            }

            closeModal();
            await loadInvoices();

        } catch (err) {
            alert('Error saving invoice. Please try again.');
        }
    }

    init();
</script>

</body>
</html>
