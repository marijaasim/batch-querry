<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarry Management — Blocks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #ffffff;
        }

        .navbar {
            background: #16213e;
            border-bottom: 2px solid #e94560;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .navbar h1 {
            color: #e94560;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #a0a0b0;
            color: #a0a0b0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-back:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        .main {
            padding: 32px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #0f3460;
            color: #a0a0b0;
            border: 1px solid #1a4a7a;
        }

        .btn-secondary:hover {
            border-color: #e94560;
            color: white;
        }

        .filters-panel {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .filters-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
            margin-bottom: 16px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .filter-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0a0b0;
            margin-bottom: 6px;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #e94560;
        }

        .filter-group select option {
            background: #16213e;
        }

        .table-container {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #0f3460;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0b0;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid #0f3460;
            color: #e0e0e0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(233, 69, 96, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: #a0a0b0;
        }

        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-a {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
            border: 1px solid #27ae60;
        }

        .badge-b {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid #f39c12;
        }

        .badge-c {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border: 1px solid #e94560;
        }

        .category-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(74, 144, 217, 0.2);
            color: #4a90d9;
            border: 1px solid #4a90d9;
        }

        .volume {
            color: #9b59b6;
            font-weight: 600;
        }

        .price {
            color: #27ae60;
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-left">
        <a href="/index.html" class="btn-back">← Back</a>
        <h1>Quarry Management</h1>
    </div>
</nav>

<div class="main">
    <div class="top-bar">
        <div class="page-title">Blocks</div>
    </div>

    <div class="filters-panel">
        <div class="filters-title">🔍 Filter</div>
        <div class="filters-grid">
            <div class="filter-group">
                <label>Quality Class</label>
                <select id="filterClass" onchange="applyFilters()">
                    <option value="">All classes</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Category</label>
                <select id="filterCategory" onchange="applyFilters()">
                    <option value="">All categories</option>
                    <option value="1">1 — Volume &gt; 6m³</option>
                    <option value="2">2 — Volume 3–6m³</option>
                    <option value="3">3 — Volume &lt; 3m³</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Length (m)</th>
                <th>Width (m)</th>
                <th>Height (m)</th>
                <th>Volume (m³)</th>
                <th>Mass (t)</th>
                <th>Quality Class</th>
                <th>Category</th>
                <th>Price (€)</th>
            </tr>
            </thead>
            <tbody id="blocksTable">
            <tr><td colspan="9" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = '/login.html';

    const PRICES = {
        'A': { '1': 200, '2': 190, '3': 180 },
        'B': { '1': 160, '2': 150, '3': 140 },
        'C': { '1': 120, '2': 110, '3': 100 }
    };

    function calculatePrice(block) {
        const pricePerTon = PRICES[block.qualityClass]?.[block.category] ?? 100;
        return Math.round(pricePerTon * block.mass * 100) / 100;
    }

    let blocks = [];

    async function init() {
        await loadBlocks();
    }

    async function loadBlocks() {
        const res = await fetch('/blocks');
        blocks = await res.json();
        renderTable(blocks);
    }

    function renderTable(data) {
        const tbody = document.getElementById('blocksTable');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No blocks found.</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(b => {
            const volumeM3 = ((b.length * b.width * b.height) / 1_000_000).toFixed(2);
            const massInTons = (b.mass).toFixed(2);
            const price = calculatePrice(b);
            return `
                <tr>
                    <td>#${b.id}</td>
                    <td>${b.length}</td>
                    <td>${b.width}</td>
                    <td>${b.height}</td>
                    <td class="volume">${volumeM3} m³</td>
                    <td>${massInTons} t</td>
                    <td><span class="badge badge-${b.qualityClass.toLowerCase()}">${b.qualityClass}</span></td>
                    <td><span class="category-badge">Cat. ${b.category}</span></td>
                    <td class="price">€ ${price.toFixed(2)}</td>
                </tr>
            `;
        }).join('');
    }

    function applyFilters() {
        const cls = document.getElementById('filterClass').value;
        const cat = document.getElementById('filterCategory').value;

        let filtered = blocks;
        if (cls) filtered = filtered.filter(b => b.qualityClass === cls);
        if (cat) filtered = filtered.filter(b => b.category === cat);

        renderTable(filtered);
    }

    function clearFilters() {
        document.getElementById('filterClass').value = '';
        document.getElementById('filterCategory').value = '';
        renderTable(blocks);
    }

    init();
</script>

</body>
</html>
