<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarry Management — Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #16213e;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid #0f3460;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo h1 {
            color: #e94560;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo p {
            color: #a0a0b0;
            font-size: 13px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #e94560;
        }

        input::placeholder {
            color: #4a4a6a;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background: #c73652;
        }

        .error-msg {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid #e94560;
            color: #e94560;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <h1>Quarry Management</h1>
        <p>Sign in to continue</p>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <button class="btn-login" onclick="login()">Sign In</button>

    <div class="error-msg" id="errorMsg">Invalid email or password.</div>
</div>

<script>
    // if already logged in, go to main menu
    if (localStorage.getItem('user')) {
        window.location.href = '/index.html';
    }

    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            showError('Please enter email and password.');
            return;
        }

        try {
            const response = await fetch('/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) {
                showError('Invalid email or password.');
                return;
            }

            const user = await response.json();

            if (!user || !user.id) {
                showError('Invalid email or password.');
                return;
            }

            localStorage.setItem('user', JSON.stringify(user));
            window.location.href = '/index.html';

        } catch (err) {
            showError('Connection error. Please try again.');
        }
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // login on Enter key
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
</script>

</body>
</html>
